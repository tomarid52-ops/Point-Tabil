<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nightmare X Official • Daily Scrim Standings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;1,700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --bg-page: #090514;
      --panel-bg: #140b29;
      --purple-dark: #190936;
      --purple-mid: #2b105c;
      --purple-glow: #9333ea;
      --neon-purple: #c084fc;
      --gold: #facc15;
      --gold-deep: #d97706;
      --text-white: #ffffff;
      --text-soft: #e9d5ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Chakra Petch', 'Hind Siliguri', sans-serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(147, 51, 234, 0.25), transparent 40%),
        radial-gradient(circle at 80% 20%, rgba(250, 204, 21, 0.12), transparent 35%),
        var(--bg-page);
      color: var(--text-white);
      padding: 14px 10px 55px;
      min-height: 100vh;
    }

    .wrap {
      max-width: 820px;
      margin: 0 auto;
    }

    .control-box {
      background: var(--panel-bg);
      border: 1px solid rgba(192, 132, 252, 0.28);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--gold);
    }

    button {
      font-family: 'Chakra Petch', 'Hind Siliguri', sans-serif;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.14s ease, opacity 0.2s ease;
    }

    button:active {
      transform: scale(0.97);
    }

    .btn-purple {
      background: linear-gradient(135deg, #9333ea, #6b21a8);
      color: #fff;
      padding: 8px 14px;
      font-size: 0.8rem;
      border: 1px solid rgba(216, 180, 254, 0.35);
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }

    .tab-btn {
      background: rgba(88, 28, 135, 0.45);
      color: var(--text-soft);
      border: 1px solid rgba(192, 132, 252, 0.25);
      padding: 8px 4px;
      font-size: 0.78rem;
      border-radius: 9px;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #facc15, #eab308);
      color: #140724;
      border-color: #fef08a;
    }

    .slot-editor {
      display: none;
      margin-top: 10px;
      margin-bottom: 12px;
      padding-top: 10px;
      border-top: 1px dashed rgba(192, 132, 252, 0.3);
    }

    .slot-editor.show {
      display: block;
    }

    .edit-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 8px;
    }

    .edit-grid input,
    textarea {
      width: 100%;
      background: #0d061c;
      border: 1px solid rgba(192, 132, 252, 0.35);
      color: #fff;
      border-radius: 8px;
      padding: 8px 10px;
      font-family: 'Chakra Petch', 'Hind Siliguri', sans-serif;
      font-size: 0.8rem;
    }

    textarea {
      min-height: 92px;
      margin-bottom: 8px;
    }

    /* =======================================================
       NIGHTMARE X PURPLE-GOLD ESPORTS POSTER SHEET
       ======================================================= */
    .poster-export {
      width: 100%;
      background:
        radial-gradient(circle at 50% 0%, rgba(168, 85, 247, 0.42), transparent 55%),
        radial-gradient(circle at 10% 35%, rgba(250, 204, 21, 0.14), transparent 35%),
        radial-gradient(circle at 90% 35%, rgba(139, 92, 246, 0.28), transparent 40%),
        linear-gradient(180deg, #130626 0%, #1b0938 42%, #0e051d 100%);
      border: 2px solid #c084fc;
      border-radius: 18px;
      padding: 16px 14px 14px;
      box-shadow: 0 0 35px rgba(147, 51, 234, 0.4);
      position: relative;
      overflow: hidden;
    }

    .poster-header {
      text-align: center;
      padding-bottom: 10px;
      position: relative;
    }

    .top-badges {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 1.4px;
      margin-bottom: 4px;
    }

    .ff-tag {
      color: #fde047;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(250, 204, 21, 0.45);
      padding: 2px 8px;
      border-radius: 5px;
      text-transform: uppercase;
    }

    .booyah-tag {
      font-style: italic;
      color: #fde047;
      text-shadow: 0 0 12px rgba(250, 204, 21, 0.6);
      letter-spacing: 1.8px;
    }

    .nx-main-brand {
      font-size: clamp(1.6rem, 5vw, 2.55rem);
      font-weight: 700;
      font-style: italic;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      line-height: 1;
      background: linear-gradient(180deg, #ffffff 10%, #e9d5ff 45%, #a855f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 3px 10px rgba(168, 85, 247, 0.65));
    }

    .nx-sub-official {
      font-size: clamp(0.85rem, 2.4vw, 1.15rem);
      font-weight: 700;
      letter-spacing: 3.5px;
      color: #ffffff;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .scrim-pill {
      display: inline-block;
      margin-top: 5px;
      padding: 3px 16px;
      border-radius: 99px;
      background: linear-gradient(90deg, rgba(88, 28, 135, 0.9), rgba(147, 51, 234, 0.9), rgba(88, 28, 135, 0.9));
      border: 1px solid rgba(233, 213, 255, 0.45);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #f3e8ff;
      text-transform: uppercase;
    }

    .standings-banner-bar {
      margin: 8px auto 12px;
      padding: 6px 14px;
      border-radius: 8px;
      background: linear-gradient(90deg, #78350f, #facc15, #fef08a, #facc15, #78350f);
      border: 1.5px solid #fef08a;
      box-shadow: 0 4px 20px rgba(250, 204, 21, 0.4);
      text-align: center;
      font-size: clamp(1rem, 3.2vw, 1.45rem);
      font-weight: 700;
      font-style: italic;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #160729;
    }

    .table-shell {
      background: rgba(13, 5, 28, 0.85);
      border: 1.5px solid rgba(192, 132, 252, 0.55);
      border-radius: 12px;
      padding: 6px;
      box-shadow: inset 0 0 22px rgba(147, 51, 234, 0.35);
    }

    table {
      width: 100%;
      table-layout: fixed;
      border-collapse: separate;
      border-spacing: 0 4px;
    }

    thead th {
      background: linear-gradient(180deg, #3b0764, #22053d);
      color: #f3e8ff;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 6px 3px;
      text-align: center;
      border-top: 1px solid rgba(216, 180, 254, 0.35);
      border-bottom: 1px solid rgba(216, 180, 254, 0.35);
      white-space: nowrap;
    }

    thead th.left {
      text-align: left;
      padding-left: 6px;
    }

    tbody tr {
      background: linear-gradient(90deg, rgba(46, 16, 101, 0.85), rgba(24, 9, 54, 0.92), rgba(46, 16, 101, 0.85));
      box-shadow: inset 0 0 0 1px rgba(192, 132, 252, 0.22);
    }

    tbody tr.rank-1 {
      background: linear-gradient(90deg, rgba(250, 204, 21, 0.32), rgba(88, 28, 135, 0.88) 45%, rgba(250, 204, 21, 0.24));
      box-shadow: inset 0 0 0 1px rgba(250, 204, 21, 0.75);
    }

    tbody tr.rank-2 {
      background: linear-gradient(90deg, rgba(216, 180, 254, 0.24), rgba(59, 7, 100, 0.88) 55%);
      box-shadow: inset 0 0 0 1px rgba(216, 180, 254, 0.5);
    }

    tbody tr.rank-3 {
      background: linear-gradient(90deg, rgba(217, 119, 6, 0.26), rgba(59, 7, 100, 0.88) 55%);
      box-shadow: inset 0 0 0 1px rgba(245, 158, 11, 0.5);
    }

    tbody td {
      padding: 6px 3px;
      font-size: 0.75rem;
      font-weight: 700;
      text-align: center;
      vertical-align: middle;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    tbody td.left {
      text-align: left;
      padding-left: 6px;
    }

    tbody td:first-child {
      border-top-left-radius: 7px;
      border-bottom-left-radius: 7px;
      color: var(--gold);
    }

    tbody td:last-child {
      border-top-right-radius: 7px;
      border-bottom-right-radius: 7px;
      background: rgba(250, 204, 21, 0.16);
      color: #fde047;
      font-size: 0.8rem;
    }

    .logo-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 20px;
      border-radius: 5px;
      background: linear-gradient(135deg, #7e22ce, #3b0764);
      border: 1px solid rgba(250, 204, 21, 0.5);
      color: #fde047;
      font-size: 0.62rem;
      font-weight: 700;
    }

    .team-title {
      display: block;
      font-size: 0.74rem;
      font-weight: 700;
      color: #ffffff;
      text-transform: uppercase;
      line-height: 1.1;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .igl-sub {
      display: block;
      font-size: 0.58rem;
      font-weight: 600;
      color: #d8b4fe;
      margin-top: 1px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .score-inp {
      width: 42px;
      padding: 3px 3px;
      text-align: center;
      font-size: 0.72rem;
      font-weight: 700;
      border-radius: 5px;
      border: 1px solid rgba(192, 132, 252, 0.5);
      background: #120624;
      color: #fde047;
    }

    .poster-footer {
      margin-top: 10px;
      padding-top: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .foot-left {
      color: #facc15;
    }

    .foot-center {
      color: #ffffff;
      font-style: italic;
      letter-spacing: 1.5px;
    }

    .foot-right {
      color: #e9d5ff;
    }

    /* Actions */
    .btn-download-pic {
      width: 100%;
      background: linear-gradient(135deg, #facc15, #eab308);
      color: #140624;
      padding: 12px 16px;
      font-size: 0.88rem;
      margin-bottom: 10px;
      box-shadow: 0 6px 20px rgba(250, 204, 21, 0.3);
    }

    .bottom-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-wa {
      background: linear-gradient(135deg, #7e22ce, #581c87);
      color: #fff;
      border: 1px solid rgba(216, 180, 254, 0.35);
      padding: 10px 12px;
      font-size: 0.82rem;
    }

    .btn-reset {
      background: rgba(30, 11, 61, 0.9);
      color: #fde047;
      border: 1px solid rgba(250, 204, 21, 0.35);
      padding: 10px 12px;
      font-size: 0.82rem;
    }

    @media (max-width: 540px) {
      .tabs {
        grid-template-columns: repeat(3, 1fr);
      }
      .edit-grid {
        grid-template-columns: 1fr;
      }
      thead th {
        font-size: 0.52rem;
        padding: 5px 1px;
        letter-spacing: 0;
      }
      tbody td {
        font-size: 0.68rem;
        padding: 5px 1px;
      }
      .team-title {
        font-size: 0.67rem;
      }
      .igl-sub {
        font-size: 0.53rem;
      }
      .logo-chip {
        width: 20px;
        height: 18px;
        font-size: 0.55rem;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="control-box">
      <div class="top-bar">
        <div class="section-title">NIGHTMARE X SCRIMS • POINTS PANEL</div>
        <button id="toggleEditorBtn" class="btn-purple" type="button">📋 Edit Banner &amp; Slots</button>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="overall" type="button">Overall</button>
        <button class="tab-btn" data-tab="m1" type="button">Match 1</button>
        <button class="tab-btn" data-tab="m2" type="button">Match 2</button>
        <button class="tab-btn" data-tab="m3" type="button">Match 3</button>
        <button class="tab-btn" data-tab="slots" type="button">Slot List</button>
      </div>

      <div id="editorPanel" class="slot-editor">
        <div class="edit-grid">
          <input type="text" id="inputBrand" placeholder="Main Title (e.g. NIGHTMARE X)" />
          <input type="text" id="inputSub" placeholder="Subtitle (e.g. OFFICIAL • DAILY SCRIM)" />
        </div>
        <textarea id="slotPasteBox" placeholder="প্রতি লাইনে একটি করে টিম লিখো: Team Name | IGL Name&#10;যেমন:&#10;PIRATE ESPORTS | Shuvo&#10;NIGHTMARE X | Nx shahin"></textarea>
        <button id="saveSlotsBtn" class="btn-purple" type="button">✔ Save Slots &amp; Banner</button>
      </div>

      <div id="posterExport" class="poster-export">
        <div class="poster-header">
          <div class="top-badges">
            <span class="ff-tag">FREE FIRE</span>
            <span class="booyah-tag">BOOYAH!</span>
          </div>
          <div id="viewBrand" class="nx-main-brand">NIGHTMARE X</div>
          <div id="viewSub" class="nx-sub-official">OFFICIAL • DAILY SCRIM</div>
          <div id="viewPill" class="scrim-pill">3-MATCH SCRIM EDITION</div>
        </div>

        <div id="viewStandingsTitle" class="standings-banner-bar">OVERALL STANDINGS</div>

        <div class="table-shell">
          <table>
            <colgroup>
              <col style="width: 8%;" />
              <col style="width: 8%;" />
              <col style="width: 28%;" />
              <col style="width: 14%;" />
              <col style="width: 11%;" />
              <col style="width: 11%;" />
              <col style="width: 15%;" />
              <col style="width: 12%;" />
            </colgroup>
            <thead id="tblHead"></thead>
            <tbody id="tblBody"></tbody>
          </table>
        </div>

        <div class="poster-footer">
          <span class="foot-left">NIGHTMARE X FAMILY</span>
          <span class="foot-center">TOGETHER WE DOMINATE</span>
          <span class="foot-right">FREE FIRE</span>
        </div>
      </div>
    </div>

    <div class="control-box">
      <button id="downloadPicBtn" class="btn-download-pic" type="button">
        🖼️ DOWNLOAD STANDINGS PIC (PNG)
      </button>
      <div class="bottom-row">
        <button id="copyWaBtn" class="btn-wa" type="button">📋 Copy WhatsApp Text</button>
        <button id="resetBtn" class="btn-reset" type="button">🔄 Reset Scores</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "nx_purple_scrims_v1";
    let activeTab = "overall";

    const initialSquads = [
      { slot: 1, logo: "PE", name: "PIRATE ESPORTS", igl: "Shuvo", m1: { pp: 12, fp: 10, cd: 0 }, m2: { pp: 9, fp: 7, cd: 0 }, m3: { pp: 0, fp: 0, cd: 0 } },
      { slot: 2, logo: "NX", name: "NIGHTMARE X", igl: "Nx shahin", m1: { pp: 8, fp: 6, cd: 1 }, m2: { pp: 6, fp: 6, cd: 0 }, m3: { pp: 0, fp: 0, cd: 0 } },
      { slot: 3, logo: "BP", name: "BLACK PANTHER", igl: "BP HUNTAR", m1: { pp: 0, fp: 0, cd: 0 }, m2: { pp: 0, fp: 0, cd: 0 }, m3: { pp: 0, fp: 0, cd: 0 } },
      { slot: 4, logo: "TEC", name: "TEC", igl: "blade", m1: { pp: 0, fp: 0, cd: 0 }, m2: { pp: 0, fp: 0, cd: 0 }, m3: { pp: 0, fp: 0, cd: 0 } },
      { slot: 5, logo: "NX", name: "NIGHTMARE X", igl: "NX J!HAD", m1: { pp: 0, fp: 0, cd: 0 }, m2: { pp: 0, fp: 0, cd: 0 }, m3: { pp: 0, fp: 0, cd: 0 } },
      { slot: 6, logo: "EH", name: "ELITE HAVOC", igl: "EH.MIKAGE", m1: { pp: 0, fp: 0, cd: 0 }, m2: { pp: 0, fp: 0, cd: 0 }, m3: { pp: 0, fp: 0, cd: 0 } },
      { slot: 7, logo: "MF", name: "MAX FREM", igl: "MF RAJ!", m1: { pp: 0, fp: 0, cd: 0 }, m2: { pp: 0, fp: 0, cd: 0 }, m3: { pp: 0, fp: 0, cd: 0 } },
      { slot: 8, logo: "SX", name: "SAVAGE X", igl: "ZYN TAMIM", m1: { pp: 0, fp: 0, cd: 0 }, m2: { pp: 0, fp: 0, cd: 0 }, m3: { pp: 0, fp: 0, cd: 0 } },
      { slot: 9, logo: "TS9", name: "TEAM SLOT 9", igl: "-", m1: { pp: 0, fp: 0, cd: 0 }, m2: { pp: 0, fp: 0, cd: 0 }, m3: { pp: 0, fp: 0, cd: 0 } },
      { slot: 10, logo: "T10", name: "TEAM SLOT 10", igl: "-", m1: { pp: 0, fp: 0, cd: 0 }, m2: { pp: 0, fp: 0, cd: 0 }, m3: { pp: 0, fp: 0, cd: 0 } },
      { slot: 11, logo: "T11", name: "TEAM SLOT 11", igl: "-", m1: { pp: 0, fp: 0, cd: 0 }, m2: { pp: 0, fp: 0, cd: 0 }, m3: { pp: 0, fp: 0, cd: 0 } },
      { slot: 12, logo: "T12", name: "TEAM SLOT 12", igl: "-", m1: { pp: 0, fp: 0, cd: 0 }, m2: { pp: 0, fp: 0, cd: 0 }, m3: { pp: 0, fp: 0, cd: 0 } }
    ];

    let state = {
      brand: "NIGHTMARE X",
      sub: "OFFICIAL • DAILY SCRIM",
      teams: structuredClone(initialSquads)
    };

    function esc(s) {
      return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function makeLogo(name) {
      const words = String(name || "NX").trim().split(/\s+/);
      if (words.length >= 2) return (words[0][0] + words[1][0]).toUpperCase();
      return String(name || "NX").slice(0, 3).toUpperCase();
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          state = { ...state, ...parsed, teams: parsed.teams || structuredClone(initialSquads) };
        }
      } catch (e) {}
      document.getElementById("inputBrand").value = state.brand;
      document.getElementById("inputSub").value = state.sub;
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function calcOverall(team) {
      let placePoint = 0, killPoint = 0, booyah = 0;
      [team.m1, team.m2, team.m3].forEach(m => {
        placePoint += Number(m.pp) || 0;
        killPoint += Number(m.fp) || 0;
        booyah += Number(m.cd) || 0;
      });
      return {
        placePoint,
        killPoint,
        totalPoint: placePoint + killPoint,
        booyah
      };
    }

    function renderBoard() {
      document.getElementById("viewBrand").textContent = state.brand;
      document.getElementById("viewSub").textContent = state.sub;

      const titleMap = {
        overall: "OVERALL STANDINGS",
        m1: "MATCH 1 STANDINGS",
        m2: "MATCH 2 STANDINGS",
        m3: "MATCH 3 STANDINGS",
        slots: "REGISTERED SLOT LIST"
      };
      document.getElementById("viewStandingsTitle").textContent = titleMap[activeTab] || "OVERALL STANDINGS";

      const thead = document.getElementById("tblHead");
      const tbody = document.getElementById("tblBody");
      tbody.innerHTML = "";

      if (activeTab === "overall") {
        thead.innerHTML = `
          <tr>
            <th>RANK</th>
            <th>LOGO</th>
            <th class="left">TEAM NAME</th>
            <th>IGL</th>
            <th>PLACE PT</th>
            <th>KILL PT</th>
            <th>TOTAL POINT</th>
            <th>BOOYAH</th>
          </tr>
        `;

        const sorted = state.teams
          .map((t, idx) => ({ ...t, idx, st: calcOverall(t) }))
          .sort((a, b) => b.st.totalPoint - a.st.totalPoint || b.st.booyah - a.st.booyah || b.st.killPoint - a.st.killPoint || a.slot - b.slot);

        sorted.forEach((item, i) => {
          const rank = i + 1;
          const tr = document.createElement("tr");
          if (rank <= 3) tr.className = `rank-${rank}`;
          const rankLabel = rank <= 3 ? `${rank}` : `#${rank}`;
          tr.innerHTML = `
            <td>${rankLabel}</td>
            <td><span class="logo-chip">${esc(item.logo)}</span></td>
            <td class="left"><span class="team-title">${esc(item.name)}</span></td>
            <td><span class="igl-sub">${esc(item.igl || "-")}</span></td>
            <td>${item.st.placePoint}</td>
            <td>${item.st.killPoint}</td>
            <td>${item.st.totalPoint} PTS</td>
            <td>${item.st.booyah}</td>
          `;
          tbody.appendChild(tr);
        });
      } else if (activeTab === "m1" || activeTab === "m2" || activeTab === "m3") {
        const mk = activeTab;
        thead.innerHTML = `
          <tr>
            <th style="width:9%;">SLOT</th>
            <th class="left" style="width:33%;">TEAM NAME</th>
            <th style="width:15%;">PLACE PT</th>
            <th style="width:15%;">KILL PT</th>
            <th style="width:14%;">BOOYAH</th>
            <th style="width:14%;">TOTAL</th>
          </tr>
        `;

        state.teams.forEach((t, idx) => {
          const m = t[mk];
          const tot = (Number(m.pp) || 0) + (Number(m.fp) || 0);
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>#${t.slot}</td>
            <td class="left"><span class="team-title">${esc(t.name)}</span></td>
            <td><input class="score-inp" type="number" min="0" max="50" value="${m.pp || 0}" data-idx="${idx}" data-m="${mk}" data-f="pp" /></td>
            <td><input class="score-inp" type="number" min="0" max="60" value="${m.fp || 0}" data-idx="${idx}" data-m="${mk}" data-f="fp" /></td>
            <td><input class="score-inp" type="number" min="0" max="1" value="${m.cd || 0}" data-idx="${idx}" data-m="${mk}" data-f="cd" /></td>
            <td>${tot}</td>
          `;
          tbody.appendChild(tr);
        });

        tbody.querySelectorAll("input.score-inp").forEach(inp => {
          inp.addEventListener("input", (e) => {
            const idx = Number(e.target.dataset.idx);
            const mk = e.target.dataset.m;
            const fk = e.target.dataset.f;
            state.teams[idx][mk][fk] = Math.max(0, Number(e.target.value) || 0);
            saveState();
            const updatedTot = (Number(state.teams[idx][mk].pp) || 0) + (Number(state.teams[idx][mk].fp) || 0);
            e.target.closest("tr").lastElementChild.textContent = updatedTot;
          });
        });
      } else if (activeTab === "slots") {
        thead.innerHTML = `
          <tr>
            <th style="width:12%;">SLOT</th>
            <th style="width:12%;">LOGO</th>
            <th class="left" style="width:42%;">TEAM NAME</th>
            <th class="left" style="width:34%;">IGL</th>
          </tr>
        `;
        state.teams.forEach(t => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>#${t.slot}</td>
            <td><span class="logo-chip">${esc(t.logo)}</span></td>
            <td class="left"><span class="team-title">${esc(t.name)}</span></td>
            <td class="left"><span class="igl-sub">${esc(t.igl || "-")}</span></td>
          `;
          tbody.appendChild(tr);
        });
      }
    }

    async function downloadPic() {
      const target = document.getElementById("posterExport");
      const btn = document.getElementById("downloadPicBtn");
      const old = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = "⏳ DOWNLOADING PIC...";

      try {
        if (document.fonts && document.fonts.ready) await document.fonts.ready;
        const exportWidth = 780;
        const canvas = await html2canvas(target, {
          scale: 2.5,
          useCORS: true,
          backgroundColor: "#0e051d",
          width: exportWidth,
          windowWidth: exportWidth,
          scrollX: 0,
          scrollY: 0,
          logging: false,
          onclone: (docClone) => {
            const el = docClone.getElementById("posterExport");
            if (el) {
              el.style.width = exportWidth + "px";
              el.style.maxWidth = exportWidth + "px";
              el.style.overflow = "visible";
            }
          }
        });

        const link = document.createElement("a");
        link.href = canvas.toDataURL("image/png", 1.0);
        link.download = "NightmareX-Overall-Standings.png";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      } catch (err) {
        alert("ছবি ডাউনলোডে সমস্যা হয়েছে: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = old;
      }
    }

    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeTab = btn.dataset.tab;
        renderBoard();
      });
    });

    document.getElementById("toggleEditorBtn").addEventListener("click", () => {
      document.getElementById("editorPanel").classList.toggle("show");
    });

    document.getElementById("saveSlotsBtn").addEventListener("click", () => {
      state.brand = document.getElementById("inputBrand").value.trim() || "NIGHTMARE X";
      state.sub = document.getElementById("inputSub").value.trim() || "OFFICIAL • DAILY SCRIM";

      const lines = document.getElementById("slotPasteBox").value
        .split(/\r?\n/)
        .map(l => l.trim())
        .filter(Boolean);

      if (lines.length) {
        lines.slice(0, 12).forEach((line, i) => {
          const [teamPart, iglPart] = line.split("|").map(s => (s || "").trim());
          if (!state.teams[i]) {
            state.teams[i] = {
              slot: i + 1,
              logo: `T${i + 1}`,
              name: `TEAM SLOT ${i + 1}`,
              igl: "-",
              m1: { pp: 0, fp: 0, cd: 0 },
              m2: { pp: 0, fp: 0, cd: 0 },
              m3: { pp: 0, fp: 0, cd: 0 }
            };
          }
          if (teamPart) {
            state.teams[i].name = teamPart;
            state.teams[i].logo = makeLogo(teamPart);
          }
          state.teams[i].igl = iglPart || "-";
        });
      }

      saveState();
      renderBoard();
      document.getElementById("editorPanel").classList.remove("show");
    });

    document.getElementById("downloadPicBtn").addEventListener("click", downloadPic);

    document.getElementById("resetBtn").addEventListener("click", () => {
      if (!confirm("সব ম্যাচের পয়েন্ট রিসেট করতে চাও?")) return;
      state.teams.forEach(t => {
        t.m1 = { pp: 0, fp: 0, cd: 0 };
        t.m2 = { pp: 0, fp: 0, cd: 0 };
        t.m3 = { pp: 0, fp: 0, cd: 0 };
      });
      saveState();
      renderBoard();
    });

    document.getElementById("copyWaBtn").addEventListener("click", () => {
      const sorted = state.teams
        .map(t => ({ ...t, st: calcOverall(t) }))
        .sort((a, b) => b.st.totalPoint - a.st.totalPoint);

      const lines = [
        `🏆 *${state.brand} (${state.sub})*`,
        `📊 *OVERALL STANDINGS*`,
        ""
      ];
      sorted.forEach((t, i) => {
        lines.push(`#${i + 1} *${t.name}* — ${t.st.totalPoint} PTS (Place: ${t.st.placePoint} | Kill: ${t.st.killPoint} | Booyah: ${t.st.booyah})`);
      });
      navigator.clipboard?.writeText(lines.join("\n"));
      alert("WhatsApp standings text কপি হয়েছে!");
    });

    loadState();
    renderBoard();
  </script>
</body>
</html>
