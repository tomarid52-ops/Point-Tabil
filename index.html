<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nightmare X Scrims | Standings &amp; Poster Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;1,700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --bg-page: #090b10;
      --bg-panel: #121622;
      --bg-card: #181d2c;
      --green-dark: #0f6b2f;
      --green-mid: #169440;
      --green-bright: #22c55e;
      --gold: #facc15;
      --red-accent: #ef4444;
      --text-light: #f8fafc;
      --text-dim: #94a3b8;
      --border-soft: rgba(255, 255, 255, 0.09);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Chakra Petch', 'Hind Siliguri', sans-serif;
      background: var(--bg-page);
      color: var(--text-light);
      padding: 16px 12px 60px;
      min-height: 100vh;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    .section-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-soft);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 0.92rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-light);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: 1.5fr 0.8fr 0.8fr auto;
      gap: 10px;
      align-items: end;
    }

    label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-bottom: 4px;
    }

    input, select {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      color: var(--text-light);
      padding: 9px 11px;
      border-radius: 8px;
      font-family: 'Chakra Petch', 'Hind Siliguri', sans-serif;
      font-size: 0.88rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--green-bright);
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    button {
      font-family: 'Chakra Petch', 'Hind Siliguri', sans-serif;
      font-weight: 700;
      font-size: 0.86rem;
      border: none;
      border-radius: 9px;
      padding: 10px 15px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: transform 0.14s ease, opacity 0.2s ease;
    }

    button:active {
      transform: scale(0.97);
    }

    .btn-green {
      background: linear-gradient(135deg, #16a34a, #0f6b2f);
      color: #fff;
    }

    .btn-gold {
      background: linear-gradient(135deg, #facc15, #eab308);
      color: #0b0d12;
    }

    .btn-dark {
      background: var(--bg-card);
      color: var(--text-light);
      border: 1px solid var(--border-soft);
    }

    /* =======================================================
       POSTER / STANDINGS SHEET (DIRECT PIC DOWNLOAD TARGET)
       ======================================================= */
    .poster-frame {
      background: #ffffff;
      color: #0f172a;
      border-radius: 18px;
      padding: 18px 16px 14px;
      border: 3px solid #14532d;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
    }

    /* Updated High-Impact Esports Banner */
    .poster-banner {
      position: relative;
      background: linear-gradient(135deg, #071b10 0%, #0e3b1f 55%, #071b10 100%);
      border: 2px solid #16a34a;
      border-radius: 14px;
      padding: 16px 14px 14px;
      text-align: center;
      margin-bottom: 14px;
      overflow: hidden;
    }

    .poster-banner::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #22c55e, #facc15, #22c55e);
    }

    .banner-top-tag {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #fde047;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(250, 204, 21, 0.35);
      padding: 3px 12px;
      border-radius: 99px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .banner-org {
      font-size: clamp(1rem, 3vw, 1.35rem);
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #ffffff;
      text-transform: uppercase;
      line-height: 1.15;
    }

    .banner-presents {
      font-size: 0.68rem;
      letter-spacing: 3px;
      color: #86efac;
      text-transform: uppercase;
      margin: 2px 0;
      font-weight: 700;
    }

    .banner-main-title {
      font-size: clamp(1.45rem, 4.5vw, 2.2rem);
      font-weight: 700;
      font-style: italic;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: linear-gradient(180deg, #ffffff 15%, #fde047 65%, #f59e0b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.1;
      margin: 2px 0 8px;
    }

    .banner-stage-bar {
      display: inline-block;
      background: linear-gradient(90deg, #15803d, #22c55e, #15803d);
      color: #ffffff;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      padding: 5px 18px;
      border-radius: 7px;
      box-shadow: 0 4px 12px rgba(22, 163, 74, 0.35);
    }

    /* Standings Box inside Poster */
    .standings-box {
      background: #14532d;
      border-radius: 12px;
      padding: 8px 8px 10px;
    }

    .standings-scroll {
      width: 100%;
      overflow-x: auto;
    }

    table.standings-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 5px;
      min-width: 540px;
    }

    table.standings-table thead th {
      color: #dcfce7;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 5px 7px;
      text-align: center;
    }

    table.standings-table thead th.left {
      text-align: left;
    }

    table.standings-table tbody tr {
      background: #e6f6cf;
      color: #0f172a;
    }

    table.standings-table tbody tr.top-one {
      background: linear-gradient(90deg, #fef08a, #dcfce7 65%, #e6f6cf);
    }

    table.standings-table tbody td {
      padding: 6px 7px;
      font-size: 0.82rem;
      font-weight: 700;
      text-align: center;
      vertical-align: middle;
    }

    table.standings-table tbody td.left {
      text-align: left;
    }

    table.standings-table tbody td:first-child {
      border-top-left-radius: 7px;
      border-bottom-left-radius: 7px;
      color: #15803d;
    }

    table.standings-table tbody td:last-child {
      border-top-right-radius: 7px;
      border-bottom-right-radius: 7px;
      background: rgba(21, 128, 61, 0.14);
      color: #0f172a;
      font-size: 0.88rem;
    }

    .logo-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 22px;
      border-radius: 5px;
      background: #0f5132;
      color: #ffffff;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .team-title {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.1;
      text-transform: uppercase;
    }

    .igl-line {
      display: block;
      font-size: 0.62rem;
      font-weight: 600;
      color: #334155;
      line-height: 1.15;
      margin-top: 1px;
    }

    .poster-footer {
      text-align: center;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1.2px;
      color: #14532d;
      margin-top: 10px;
      text-transform: uppercase;
    }

    .slots-list {
      max-height: 190px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    .slot-chip {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: 8px;
      padding: 7px 9px;
      display: grid;
      grid-template-columns: 32px 1fr 1fr;
      gap: 6px;
      align-items: center;
    }

    .slot-chip span {
      font-size: 0.76rem;
      font-weight: 700;
      color: #4ade80;
      text-align: center;
    }

    .slot-chip input {
      padding: 5px 7px;
      font-size: 0.78rem;
    }

    @media (max-width: 640px) {
      .grid-4 {
        grid-template-columns: 1fr 1fr;
      }
      .grid-4 button {
        grid-column: span 2;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Banner & Match Config -->
    <div class="section-card">
      <div class="section-title">
        <span>Banner &amp; Match Settings</span>
        <button id="directDownloadPicBtn" class="btn-gold" type="button">
          📥 Download Poster Pic (PNG)
        </button>
      </div>
      <div class="grid-2">
        <div>
          <label for="weekDayInput">Week &amp; Date Line</label>
          <input type="text" id="weekDayInput" value="WEEK 01 • DAY 22/11/2026" />
        </div>
        <div>
          <label for="orgNameInput">Organization Name</label>
          <input type="text" id="orgNameInput" value="NIGHTMARE X OFFICIAL" />
        </div>
        <div>
          <label for="bannerMainInput">Main Banner Title</label>
          <input type="text" id="bannerMainInput" value="NIGHTMARE X SCRIMS" />
        </div>
        <div>
          <label for="stageBarInput">Standings Subtitle Bar</label>
          <input type="text" id="stageBarInput" value="★ 3-MATCH OVERALL STANDINGS ★" />
        </div>
      </div>
      <div class="btn-row">
        <button id="copyWhatsappBtn" class="btn-green" type="button">📋 Copy WhatsApp Text</button>
        <button id="resetScoresBtn" class="btn-dark" type="button">🔄 Reset Scores</button>
      </div>
    </div>

    <!-- Quick Match Point Entry -->
    <div class="section-card">
      <div class="section-title">Add Match Result (CD / MP / PP / FP)</div>
      <div class="grid-4">
        <div>
          <label for="teamSelect">Team / Slot</label>
          <select id="teamSelect"></select>
        </div>
        <div>
          <label for="rankInput">Rank (1–12)</label>
          <input type="number" id="rankInput" min="1" max="12" value="1" />
        </div>
        <div>
          <label for="killsInput">Kills (FP)</label>
          <input type="number" id="killsInput" min="0" max="50" value="5" />
        </div>
        <button id="addMatchBtn" class="btn-green" type="button">+ Add Match</button>
      </div>

      <div id="slotsEditor" class="slots-list"></div>
    </div>

    <!-- Poster Sheet Preview (Direct PNG Export) -->
    <div id="posterSheet" class="poster-frame">
      <div class="poster-banner">
        <div id="viewWeekDay" class="banner-top-tag">WEEK 01 • DAY 22/11/2026</div>
        <div id="viewOrgName" class="banner-org">NIGHTMARE X OFFICIAL</div>
        <div class="banner-presents">PRESENTS</div>
        <div id="viewBannerMain" class="banner-main-title">NIGHTMARE X SCRIMS</div>
        <div id="viewStageBar" class="banner-stage-bar">★ 3-MATCH OVERALL STANDINGS ★</div>
      </div>

      <div class="standings-box">
        <div class="standings-scroll">
          <table class="standings-table">
            <thead>
              <tr>
                <th style="width: 44px;">RANK</th>
                <th style="width: 46px;">LOGO</th>
                <th class="left">TEAM NAME</th>
                <th style="width: 38px;">CD</th>
                <th style="width: 38px;">MP</th>
                <th style="width: 42px;">PP</th>
                <th style="width: 42px;">FP</th>
                <th style="width: 46px;">TP</th>
              </tr>
            </thead>
            <tbody id="standingsBody"></tbody>
          </table>
        </div>
      </div>

      <div id="viewFooter" class="poster-footer">
        ✦ NIGHTMARE X OFFICIAL • WEEK 01 • DAY 22/11/2026 ✦
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "nx_scrims_poster_v3";
    const placementPtsMap = [12, 9, 8, 7, 6, 5, 4, 3, 2, 1, 0, 0];

    const initialTeams = [
      { slot: 1, logo: "NX", name: "NIGHTMAREX", igl: "NX JIHAD", cd: 1, mp: 3, pp: 29, fp: 14 },
      { slot: 2, logo: "TS", name: "TEAM SLOT 2", igl: "JIHAD", cd: 0, mp: 0, pp: 0, fp: 0 },
      { slot: 3, logo: "BP", name: "BLACK PANTHER", igl: "BP HUNTAR", cd: 0, mp: 0, pp: 0, fp: 0 },
      { slot: 4, logo: "DA", name: "DANGAR", igl: "DANGER 1x", cd: 0, mp: 0, pp: 0, fp: 0 },
      { slot: 5, logo: "NX", name: "NIGHTMARE X", igl: "NX JIHAD", cd: 0, mp: 0, pp: 0, fp: 0 },
      { slot: 6, logo: "EH", name: "ELITE HAVOC", igl: "EH.MIKAGE", cd: 0, mp: 0, pp: 0, fp: 0 },
      { slot: 7, logo: "MF", name: "MAX FREM", igl: "MF RAJI", cd: 0, mp: 0, pp: 0, fp: 0 },
      { slot: 8, logo: "SX", name: "SAVAGE X", igl: "ZYN TAMIM", cd: 0, mp: 0, pp: 0, fp: 0 },
      { slot: 9, logo: "TS", name: "TEAM SLOT 9", igl: "", cd: 0, mp: 0, pp: 0, fp: 0 },
      { slot: 10, logo: "TS", name: "TEAM SLOT 10", igl: "", cd: 0, mp: 0, pp: 0, fp: 0 },
      { slot: 11, logo: "TS", name: "TEAM SLOT 11", igl: "", cd: 0, mp: 0, pp: 0, fp: 0 },
      { slot: 12, logo: "TS", name: "TEAM SLOT 12", igl: "", cd: 0, mp: 0, pp: 0, fp: 0 }
    ];

    let data = {
      weekDay: "WEEK 01 • DAY 22/11/2026",
      orgName: "NIGHTMARE X OFFICIAL",
      bannerMain: "NIGHTMARE X SCRIMS",
      stageBar: "★ 3-MATCH OVERALL STANDINGS ★",
      teams: structuredClone(initialTeams)
    };

    function pad2(n) {
      return String(Math.max(0, Number(n) || 0)).padStart(2, "0");
    }

    function makeLogoCode(name) {
      const words = String(name || "NX").trim().split(/\s+/);
      if (words.length >= 2) {
        return (words[0][0] + words[1][0]).toUpperCase();
      }
      return String(name || "NX").slice(0, 2).toUpperCase();
    }

    function escapeHtml(s) {
      return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function loadData() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          data = { ...data, ...parsed, teams: parsed.teams || structuredClone(initialTeams) };
        }
      } catch (e) {}

      document.getElementById("weekDayInput").value = data.weekDay;
      document.getElementById("orgNameInput").value = data.orgName;
      document.getElementById("bannerMainInput").value = data.bannerMain;
      document.getElementById("stageBarInput").value = data.stageBar;
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function renderSlotsEditor() {
      const wrap = document.getElementById("slotsEditor");
      const select = document.getElementById("teamSelect");
      wrap.innerHTML = "";
      select.innerHTML = "";

      data.teams.forEach((t, idx) => {
        const chip = document.createElement("div");
        chip.className = "slot-chip";
        chip.innerHTML = `
          <span>#${pad2(idx + 1)}</span>
          <input type="text" value="${escapeHtml(t.name)}" placeholder="Team Name" data-idx="${idx}" data-k="name" />
          <input type="text" value="${escapeHtml(t.igl)}" placeholder="IGL Name" data-idx="${idx}" data-k="igl" />
        `;
        wrap.appendChild(chip);

        const opt = document.createElement("option");
        opt.value = idx;
        opt.textContent = `#${pad2(idx + 1)} - ${t.name}`;
        select.appendChild(opt);
      });

      wrap.querySelectorAll("input").forEach(inp => {
        inp.addEventListener("input", (e) => {
          const i = Number(e.target.dataset.idx);
          const k = e.target.dataset.k;
          data.teams[i][k] = e.target.value;
          if (k === "name") {
            data.teams[i].logo = makeLogoCode(e.target.value);
            select.options[i].textContent = `#${pad2(i + 1)} - ${e.target.value}`;
          }
          saveData();
          renderTable();
        });
      });
    }

    function renderTable() {
      document.getElementById("viewWeekDay").textContent = data.weekDay;
      document.getElementById("viewOrgName").textContent = data.orgName;
      document.getElementById("viewBannerMain").textContent = data.bannerMain;
      document.getElementById("viewStageBar").textContent = data.stageBar;
      document.getElementById("viewFooter").textContent = `✦ ${data.orgName} • ${data.weekDay} ✦`;

      const sorted = data.teams
        .map((t, idx) => {
          const tp = (Number(t.pp) || 0) + (Number(t.fp) || 0);
          return { ...t, idx, tp };
        })
        .sort((a, b) => {
          if (b.tp !== a.tp) return b.tp - a.tp;
          if (b.cd !== a.cd) return b.cd - a.cd;
          if (b.fp !== a.fp) return b.fp - a.fp;
          return a.slot - b.slot;
        });

      const tbody = document.getElementById("standingsBody");
      tbody.innerHTML = "";

      sorted.forEach((team, i) => {
        const tr = document.createElement("tr");
        if (i === 0) tr.className = "top-one";
        tr.innerHTML = `
          <td>${pad2(i + 1)}</td>
          <td><span class="logo-pill">${escapeHtml(team.logo || makeLogoCode(team.name))}</span></td>
          <td class="left">
            <span class="team-title">${escapeHtml(team.name)}</span>
            ${team.igl ? `<span class="igl-line">IGL: ${escapeHtml(team.igl)}</span>` : ""}
          </td>
          <td>${pad2(team.cd)}</td>
          <td>${pad2(team.mp)}</td>
          <td>${pad2(team.pp)}</td>
          <td>${pad2(team.fp)}</td>
          <td>${pad2(team.tp)}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Direct Image Download (No Print/PDF Dialog)
    async function downloadPosterDirectlyAsPic() {
      const target = document.getElementById("posterSheet");
      const btn = document.getElementById("directDownloadPicBtn");
      const oldLabel = btn.innerHTML;

      btn.disabled = true;
      btn.innerHTML = "⏳ Saving PNG...";

      try {
        if (document.fonts && document.fonts.ready) {
          await document.fonts.ready;
        }

        const canvas = await html2canvas(target, {
          scale: 3,
          useCORS: true,
          backgroundColor: "#ffffff",
          logging: false
        });

        const pngUrl = canvas.toDataURL("image/png", 1.0);
        const a = document.createElement("a");
        a.href = pngUrl;
        a.download = "NightmareX-Standings-Poster.png";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      } catch (err) {
        alert("ছবি ডাউনলোডে সমস্যা হয়েছে: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = oldLabel;
      }
    }

    // Bindings
    ["weekDayInput", "orgNameInput", "bannerMainInput", "stageBarInput"].forEach((id, idx) => {
      const keys = ["weekDay", "orgName", "bannerMain", "stageBar"];
      document.getElementById(id).addEventListener("input", (e) => {
        data[keys[idx]] = e.target.value;
        saveData();
        renderTable();
      });
    });

    document.getElementById("addMatchBtn").addEventListener("click", () => {
      const teamIdx = Number(document.getElementById("teamSelect").value);
      const rank = Math.min(12, Math.max(1, Number(document.getElementById("rankInput").value) || 1));
      const kills = Math.max(0, Number(document.getElementById("killsInput").value) || 0);
      const earnedPP = placementPtsMap[rank - 1] ?? 0;

      const t = data.teams[teamIdx];
      t.mp = (Number(t.mp) || 0) + 1;
      if (rank === 1) t.cd = (Number(t.cd) || 0) + 1;
      t.pp = (Number(t.pp) || 0) + earnedPP;
      t.fp = (Number(t.fp) || 0) + kills;

      saveData();
      renderTable();
    });

    document.getElementById("resetScoresBtn").addEventListener("click", () => {
      if (!confirm("সব টিমের CD, MP, PP, FP জিরো করতে চাও?")) return;
      data.teams.forEach(t => {
        t.cd = 0;
        t.mp = 0;
        t.pp = 0;
        t.fp = 0;
      });
      saveData();
      renderTable();
    });

    document.getElementById("copyWhatsappBtn").addEventListener("click", () => {
      const ranked = data.teams
        .map(t => ({ ...t, tp: (Number(t.pp) || 0) + (Number(t.fp) || 0) }))
        .sort((a, b) => b.tp - a.tp);

      const lines = [
        `🏆 *${data.bannerMain}*`,
        `📅 ${data.weekDay}`,
        `📊 ${data.stageBar}`,
        ""
      ];
      ranked.forEach((t, i) => {
        lines.push(`#${pad2(i + 1)} *${t.name}* — ${t.tp} PTS (PP: ${t.pp} | FP: ${t.fp} | CD: ${t.cd})`);
      });

      navigator.clipboard?.writeText(lines.join("\n"));
      alert("WhatsApp standings text কপি হয়েছে!");
    });

    document.getElementById("directDownloadPicBtn").addEventListener("click", downloadPosterDirectlyAsPic);

    loadData();
    renderSlotsEditor();
    renderTable();
  </script>
</body>
</html>
