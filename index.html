<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nightmare X Scrims • Standings &amp; 3-Match Scores</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;1,700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --bg-page: #dff2e3;
      --card-bg: #ffffff;
      --green-deep: #14532d;
      --green-mid: #16803c;
      --row-bg: #e7f6cf;
      --row-top: #fef08a;
      --blue-btn: #0284c7;
      --text-dark: #0f172a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Chakra Petch', 'Hind Siliguri', sans-serif;
      background: var(--bg-page);
      color: var(--text-dark);
      padding: 14px 10px 50px;
      min-height: 100vh;
    }

    .wrap {
      max-width: 780px;
      margin: 0 auto;
    }

    .box {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: 0 8px 24px rgba(20, 83, 45, 0.12);
      border: 1px solid rgba(20, 83, 45, 0.14);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .section-heading {
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--green-deep);
    }

    button {
      font-family: 'Chakra Petch', 'Hind Siliguri', sans-serif;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.14s ease, opacity 0.2s ease;
    }

    button:active {
      transform: scale(0.97);
    }

    .btn-paste {
      background: var(--green-mid);
      color: #fff;
      padding: 8px 13px;
      font-size: 0.8rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }

    .tab-btn {
      background: #ecfdf5;
      color: var(--green-deep);
      border: 1px solid #86efac;
      padding: 8px 4px;
      font-size: 0.78rem;
      border-radius: 9px;
    }

    .tab-btn.active {
      background: var(--green-mid);
      color: #ffffff;
      border-color: var(--green-deep);
    }

    /* Exportable Poster + Table */
    .export-card {
      width: 100%;
      background: #ffffff;
      border-radius: 16px;
      padding: 12px;
      overflow: hidden;
    }

    .poster-banner {
      position: relative;
      background: linear-gradient(135deg, #062111 0%, #14532d 55%, #062111 100%);
      border: 2px solid #22c55e;
      border-radius: 14px;
      padding: 14px 12px 12px;
      text-align: center;
      margin-bottom: 10px;
      overflow: hidden;
    }

    .poster-banner::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #22c55e, #facc15, #22c55e);
    }

    .banner-date {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 1.8px;
      color: #fde047;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(250, 204, 21, 0.35);
      padding: 2px 10px;
      border-radius: 99px;
      margin-bottom: 4px;
    }

    .banner-org {
      font-size: clamp(0.95rem, 2.8vw, 1.25rem);
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      line-height: 1.15;
    }

    .banner-presents {
      font-size: 0.62rem;
      letter-spacing: 2.5px;
      color: #86efac;
      font-weight: 700;
      margin: 2px 0;
    }

    .banner-main {
      font-size: clamp(1.3rem, 4vw, 1.95rem);
      font-weight: 700;
      font-style: italic;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      background: linear-gradient(180deg, #ffffff 15%, #fde047 65%, #f59e0b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.1;
      margin: 2px 0 6px;
    }

    .banner-stage {
      display: inline-block;
      background: linear-gradient(90deg, #15803d, #22c55e, #15803d);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1.2px;
      padding: 4px 14px;
      border-radius: 6px;
    }

    .board {
      background: var(--green-deep);
      border-radius: 12px;
      padding: 7px 6px 9px;
      width: 100%;
    }

    table {
      width: 100%;
      table-layout: fixed;
      border-collapse: separate;
      border-spacing: 0 5px;
    }

    thead th {
      color: #dcfce7;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      padding: 4px 3px;
      text-align: center;
      white-space: nowrap;
    }

    thead th.left {
      text-align: left;
      padding-left: 6px;
    }

    tbody tr {
      background: var(--row-bg);
    }

    tbody tr.rank1 {
      background: linear-gradient(90deg, var(--row-top), #dcfce7 60%, var(--row-bg));
    }

    tbody td {
      padding: 6px 3px;
      font-size: 0.76rem;
      font-weight: 700;
      text-align: center;
      vertical-align: middle;
      color: var(--text-dark);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    tbody td.left {
      text-align: left;
      padding-left: 6px;
    }

    tbody td:first-child {
      border-top-left-radius: 7px;
      border-bottom-left-radius: 7px;
      color: var(--green-deep);
    }

    tbody td:last-child {
      border-top-right-radius: 7px;
      border-bottom-right-radius: 7px;
      background: rgba(20, 83, 45, 0.16);
      font-size: 0.82rem;
      font-weight: 700;
    }

    .logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 20px;
      border-radius: 5px;
      background: #0f4c2a;
      color: #fff;
      font-size: 0.64rem;
      font-weight: 700;
    }

    .t-name {
      display: block;
      font-size: 0.74rem;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.1;
      text-transform: uppercase;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .t-igl {
      display: block;
      font-size: 0.58rem;
      font-weight: 600;
      color: #334155;
      margin-top: 1px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mini-input {
      width: 42px;
      padding: 3px 3px;
      text-align: center;
      font-size: 0.74rem;
      font-weight: 700;
      border-radius: 5px;
      border: 1px solid #86efac;
      background: #ffffff;
      color: #0f172a;
    }

    .footer-line {
      margin-top: 9px;
      padding: 0 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 0.66rem;
      font-weight: 700;
      letter-spacing: 0.7px;
      color: var(--green-deep);
      text-transform: uppercase;
    }

    /* Section 3 Sharing & Direct Pic Download */
    .btn-download-pic {
      width: 100%;
      background: linear-gradient(135deg, #facc15, #eab308);
      color: #0f172a;
      padding: 12px 16px;
      font-size: 0.88rem;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 16px rgba(234, 179, 8, 0.28);
    }

    .bottom-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-wa {
      background: var(--blue-btn);
      color: #fff;
      padding: 10px 12px;
      font-size: 0.82rem;
    }

    .btn-reset {
      background: #dcfce7;
      color: var(--green-deep);
      border: 1px solid #86efac;
      padding: 10px 12px;
      font-size: 0.82rem;
    }

    /* Slot List Editor */
    .slot-editor {
      display: none;
      margin-top: 10px;
      border-top: 1px dashed #cbd5e1;
      padding-top: 10px;
    }

    .slot-editor.show {
      display: block;
    }

    textarea {
      width: 100%;
      min-height: 95px;
      border-radius: 9px;
      border: 1px solid #94a3b8;
      padding: 8px 10px;
      font-family: 'Chakra Petch', 'Hind Siliguri', sans-serif;
      font-size: 0.82rem;
      margin-bottom: 8px;
    }

    .banner-edit-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .banner-edit-grid input {
      padding: 7px 9px;
      border-radius: 7px;
      border: 1px solid #cbd5e1;
      font-family: 'Chakra Petch', 'Hind Siliguri', sans-serif;
      font-size: 0.78rem;
    }

    @media (max-width: 520px) {
      .tabs {
        grid-template-columns: repeat(3, 1fr);
      }
      .banner-edit-grid {
        grid-template-columns: 1fr;
      }
      thead th {
        font-size: 0.54rem;
        padding: 4px 1px;
        letter-spacing: 0;
      }
      tbody td {
        font-size: 0.7rem;
        padding: 5px 1px;
      }
      .t-name {
        font-size: 0.68rem;
      }
      .t-igl {
        font-size: 0.54rem;
      }
      .logo-badge {
        width: 20px;
        height: 18px;
        font-size: 0.56rem;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- Section 2: Standings & 3-Match Scores -->
    <div class="box">
      <div class="top-bar">
        <div class="section-heading">2. STANDINGS &amp; 3-MATCH SCORES</div>
        <button id="toggleSlotEditorBtn" class="btn-paste" type="button">📋 Paste Slot List</button>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="overall" type="button">Overall</button>
        <button class="tab-btn" data-tab="m1" type="button">Match 1</button>
        <button class="tab-btn" data-tab="m2" type="button">Match 2</button>
        <button class="tab-btn" data-tab="m3" type="button">Match 3</button>
        <button class="tab-btn" data-tab="slots" type="button">Slot List</button>
      </div>

      <!-- Slot List & Banner Quick Editor -->
      <div id="slotEditorBox" class="slot-editor">
        <div class="banner-edit-grid">
          <input type="text" id="editDate" placeholder="Week / Day (e.g. WEEK 01 • DAY 22/11/2026)" />
          <input type="text" id="editBannerTitle" placeholder="Banner Title (e.g. NIGHTMARE X SCRIMS)" />
        </div>
        <textarea id="pasteSlotTextarea" placeholder="প্রতি লাইনে একটি করে টিম লিখো: Team Name | IGL Name&#10;যেমন:&#10;NIGHTMARE X | NX JIHAD&#10;JOZ ARMY | TANVIR"></textarea>
        <button id="applySlotListBtn" class="btn-paste" type="button">✔ Apply Slot List</button>
      </div>

      <!-- Exportable Poster + Table -->
      <div id="exportCard" class="export-card">
        <div class="poster-banner">
          <div id="viewDate" class="banner-date">WEEK 01 • DAY 22/11/2026</div>
          <div id="viewOrg" class="banner-org">NIGHTMARE X OFFICIAL</div>
          <div class="banner-presents">PRESENTS</div>
          <div id="viewBannerTitle" class="banner-main">NIGHTMARE X SCRIMS</div>
          <div id="viewStage" class="banner-stage">★ 3-MATCH OVERALL STANDINGS ★</div>
        </div>

        <div class="board">
          <table>
            <colgroup>
              <col style="width: 8%;" />
              <col style="width: 8%;" />
              <col style="width: 34%;" />
              <col style="width: 13%;" />
              <col style="width: 8%;" />
              <col style="width: 9%;" />
              <col style="width: 9%;" />
              <col style="width: 16%;" />
            </colgroup>
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>

        <div class="footer-line">
          <span id="viewFooterLeft">✦ NIGHTMARE X OFFICIAL</span>
          <span id="viewFooterRight">WEEK 01 • DAY 22/11/2026 ✦</span>
        </div>
      </div>
    </div>

    <!-- Section 3: Direct Pic Download & Sharing -->
    <div class="box">
      <div class="section-heading" style="margin-bottom: 10px;">3. POSTER SHEET &amp; SHARING</div>
      <button id="downloadPicBtn" class="btn-download-pic" type="button">
        🖼️ DOWNLOAD STANDINGS PIC (PNG)
      </button>
      <div class="bottom-actions">
        <button id="copyWaBtn" class="btn-wa" type="button">📋 Copy WhatsApp Text</button>
        <button id="resetBtn" class="btn-reset" type="button">🔄 Reset Scores</button>
      </div>
    </div>
  </div>

  <script>
    const KEY = "nx_3match_points_v5";
    let currentTab = "overall";

    const defaultTeams = [
      { slot: 1, logo: "NI", name: "NIGHTMAREX", igl: "Nx J!HAD", m1: { pp: 12, fp: 6, cd: 1 }, m2: { pp: 9, fp: 5, cd: 0 }, m3: { pp: 8, fp: 3, cd: 0 } },
      { slot: 2, logo: "TS", name: "TEAM SLOT 2", igl: "J!HAD", m1: { pp: 0, fp: 0, cd: 0 }, m2: { pp: 0, fp: 0, cd: 0 }, m3: { pp: 0, fp: 0, cd: 0 } },
      { slot: 3, logo: "BP", name: "BLACK PANTHER", igl: "BP HUNTAR", m1: { pp: 0, fp: 0, cd: 0 }, m2: { pp: 0, fp: 0, cd: 0 }, m3: { pp: 0, fp: 0, cd: 0 } },
      { slot: 4, logo: "DA", name: "DANGAR", igl: "DANGER 1x", m1: { pp: 0, fp: 0, cd: 0 }, m2: { pp: 0, fp: 0, cd: 0 }, m3: { pp: 0, fp: 0, cd: 0 } },
      { slot: 5, logo: "NX", name: "NIGHTMARE X", igl: "NX J!HAD", m1: { pp: 0, fp: 0, cd: 0 }, m2: { pp: 0, fp: 0, cd: 0 }, m3: { pp: 0, fp: 0, cd: 0 } },
      { slot: 6, logo: "EH", name: "ELITE HAVOC", igl: "EH.MIKAGE", m1: { pp: 0, fp: 0, cd: 0 }, m2: { pp: 0, fp: 0, cd: 0 }, m3: { pp: 0, fp: 0, cd: 0 } },
      { slot: 7, logo: "MF", name: "MAX FREM", igl: "MF RAJI", m1: { pp: 0, fp: 0, cd: 0 }, m2: { pp: 0, fp: 0, cd: 0 }, m3: { pp: 0, fp: 0, cd: 0 } },
      { slot: 8, logo: "SX", name: "SAVAGE X", igl: "ZYN TAMIM", m1: { pp: 0, fp: 0, cd: 0 }, m2: { pp: 0, fp: 0, cd: 0 }, m3: { pp: 0, fp: 0, cd: 0 } },
      { slot: 9, logo: "TS", name: "TEAM SLOT 9", igl: "", m1: { pp: 0, fp: 0, cd: 0 }, m2: { pp: 0, fp: 0, cd: 0 }, m3: { pp: 0, fp: 0, cd: 0 } },
      { slot: 10, logo: "TS", name: "TEAM SLOT 10", igl: "", m1: { pp: 0, fp: 0, cd: 0 }, m2: { pp: 0, fp: 0, cd: 0 }, m3: { pp: 0, fp: 0, cd: 0 } },
      { slot: 11, logo: "TS", name: "TEAM SLOT 11", igl: "", m1: { pp: 0, fp: 0, cd: 0 }, m2: { pp: 0, fp: 0, cd: 0 }, m3: { pp: 0, fp: 0, cd: 0 } },
      { slot: 12, logo: "TS", name: "TEAM SLOT 12", igl: "", m1: { pp: 0, fp: 0, cd: 0 }, m2: { pp: 0, fp: 0, cd: 0 }, m3: { pp: 0, fp: 0, cd: 0 } }
    ];

    let appState = {
      dateLine: "WEEK 01 • DAY 22/11/2026",
      orgName: "NIGHTMARE X OFFICIAL",
      bannerTitle: "NIGHTMARE X SCRIMS",
      teams: structuredClone(defaultTeams)
    };

    function pad2(n) {
      return String(Math.max(0, Number(n) || 0)).padStart(2, "0");
    }

    function esc(s) {
      return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function makeLogo(name) {
      const parts = String(name || "NX").trim().split(/\s+/);
      if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
      return String(name || "NX").slice(0, 2).toUpperCase();
    }

    function load() {
      try {
        const raw = localStorage.getItem(KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          appState = { ...appState, ...parsed, teams: parsed.teams || structuredClone(defaultTeams) };
        }
      } catch (e) {}
      document.getElementById("editDate").value = appState.dateLine;
      document.getElementById("editBannerTitle").value = appState.bannerTitle;
    }

    function save() {
      localStorage.setItem(KEY, JSON.stringify(appState));
    }

    function computeTeamStats(t) {
      const matches = [t.m1, t.m2, t.m3];
      let booyah = 0, mp = 0, pp = 0, fp = 0;
      matches.forEach(m => {
        const mpp = Number(m.pp) || 0;
        const mfp = Number(m.fp) || 0;
        const mcd = Number(m.cd) || 0;
        if (mpp > 0 || mfp > 0 || mcd > 0) mp += 1;
        booyah += mcd;
        pp += mpp;
        fp += mfp;
      });
      return { booyah, mp, pp, fp, tp: pp + fp };
    }

    function renderAll() {
      document.getElementById("viewDate").textContent = appState.dateLine;
      document.getElementById("viewOrg").textContent = appState.orgName;
      document.getElementById("viewBannerTitle").textContent = appState.bannerTitle;
      document.getElementById("viewFooterLeft").textContent = `✦ ${appState.orgName}`;
      document.getElementById("viewFooterRight").textContent = `${appState.dateLine} ✦`;

      const stageMap = {
        overall: "★ 3-MATCH OVERALL STANDINGS ★",
        m1: "★ MATCH 1 SCOREBOARD ★",
        m2: "★ MATCH 2 SCOREBOARD ★",
        m3: "★ MATCH 3 SCOREBOARD ★",
        slots: "★ REGISTERED SLOT LIST ★"
      };
      document.getElementById("viewStage").textContent = stageMap[currentTab] || stageMap.overall;

      const thead = document.getElementById("tableHead");
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = "";

      if (currentTab === "overall") {
        thead.innerHTML = `
          <tr>
            <th>RANK</th>
            <th>LOGO</th>
            <th class="left">TEAM NAME</th>
            <th>BOOYAH</th>
            <th>MP</th>
            <th>PP</th>
            <th>FP</th>
            <th>TP</th>
          </tr>
        `;

        const rows = appState.teams
          .map((t, idx) => ({ ...t, idx, stats: computeTeamStats(t) }))
          .sort((a, b) => b.stats.tp - a.stats.tp || b.stats.booyah - a.stats.booyah || b.stats.fp - a.stats.fp || a.slot - b.slot);

        rows.forEach((r, i) => {
          const tr = document.createElement("tr");
          if (i === 0) tr.className = "rank1";
          tr.innerHTML = `
            <td>${pad2(i + 1)}</td>
            <td><span class="logo-badge">${esc(r.logo)}</span></td>
            <td class="left">
              <span class="t-name">${esc(r.name)}</span>
              ${r.igl ? `<span class="t-igl">IGL: ${esc(r.igl)}</span>` : ""}
            </td>
            <td>${pad2(r.stats.booyah)}</td>
            <td>${pad2(r.stats.mp)}</td>
            <td>${pad2(r.stats.pp)}</td>
            <td>${pad2(r.stats.fp)}</td>
            <td>${pad2(r.stats.tp)}</td>
          `;
          tbody.appendChild(tr);
        });
      } else if (currentTab === "m1" || currentTab === "m2" || currentTab === "m3") {
        const mKey = currentTab;
        thead.innerHTML = `
          <tr>
            <th style="width:9%;">SLOT</th>
            <th class="left" style="width:39%;">TEAM NAME</th>
            <th style="width:14%;">BOOYAH</th>
            <th style="width:13%;">PP</th>
            <th style="width:13%;">FP</th>
            <th style="width:12%;">TP</th>
          </tr>
        `;

        appState.teams.forEach((t, idx) => {
          const m = t[mKey];
          const tp = (Number(m.pp) || 0) + (Number(m.fp) || 0);
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${pad2(t.slot)}</td>
            <td class="left"><span class="t-name">${esc(t.name)}</span></td>
            <td><input class="mini-input" type="number" min="0" max="1" value="${m.cd || 0}" data-idx="${idx}" data-m="${mKey}" data-f="cd" /></td>
            <td><input class="mini-input" type="number" min="0" max="50" value="${m.pp || 0}" data-idx="${idx}" data-m="${mKey}" data-f="pp" /></td>
            <td><input class="mini-input" type="number" min="0" max="60" value="${m.fp || 0}" data-idx="${idx}" data-m="${mKey}" data-f="fp" /></td>
            <td>${pad2(tp)}</td>
          `;
          tbody.appendChild(tr);
        });

        tbody.querySelectorAll("input.mini-input").forEach(inp => {
          inp.addEventListener("input", (e) => {
            const idx = Number(e.target.dataset.idx);
            const mk = e.target.dataset.m;
            const fk = e.target.dataset.f;
            appState.teams[idx][mk][fk] = Math.max(0, Number(e.target.value) || 0);
            save();
            const rowTp = (Number(appState.teams[idx][mk].pp) || 0) + (Number(appState.teams[idx][mk].fp) || 0);
            e.target.closest("tr").lastElementChild.textContent = pad2(rowTp);
          });
        });
      } else if (currentTab === "slots") {
        thead.innerHTML = `
          <tr>
            <th style="width:12%;">SLOT</th>
            <th style="width:12%;">LOGO</th>
            <th class="left" style="width:40%;">TEAM NAME</th>
            <th class="left" style="width:36%;">IGL NAME</th>
          </tr>
        `;
        appState.teams.forEach(t => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${pad2(t.slot)}</td>
            <td><span class="logo-badge">${esc(t.logo)}</span></td>
            <td class="left"><span class="t-name">${esc(t.name)}</span></td>
            <td class="left"><span class="t-igl">${esc(t.igl || "-")}</span></td>
          `;
          tbody.appendChild(tr);
        });
      }
    }

    async function downloadPicDirectly() {
      const target = document.getElementById("exportCard");
      const btn = document.getElementById("downloadPicBtn");
      const orig = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = "⏳ DOWNLOADING FULL PNG...";

      try {
        if (document.fonts && document.fonts.ready) await document.fonts.ready;

        const exportWidth = 720;
        const canvas = await html2canvas(target, {
          scale: 2.5,
          useCORS: true,
          backgroundColor: "#ffffff",
          width: exportWidth,
          windowWidth: exportWidth,
          scrollX: 0,
          scrollY: 0,
          logging: false,
          onclone: (clonedDoc) => {
            const clonedCard = clonedDoc.getElementById("exportCard");
            if (clonedCard) {
              clonedCard.style.width = exportWidth + "px";
              clonedCard.style.maxWidth = exportWidth + "px";
              clonedCard.style.overflow = "visible";
            }
          }
        });

        const url = canvas.toDataURL("image/png", 1.0);
        const a = document.createElement("a");
        a.href = url;
        a.download = "NightmareX-Standings.png";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      } catch (err) {
        alert("ছবি সেভ করতে সমস্যা হয়েছে: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = orig;
      }
    }

    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentTab = btn.dataset.tab;
        renderAll();
      });
    });

    document.getElementById("toggleSlotEditorBtn").addEventListener("click", () => {
      document.getElementById("slotEditorBox").classList.toggle("show");
    });

    document.getElementById("editDate").addEventListener("input", (e) => {
      appState.dateLine = e.target.value;
      save();
      renderAll();
    });

    document.getElementById("editBannerTitle").addEventListener("input", (e) => {
      appState.bannerTitle = e.target.value;
      save();
      renderAll();
    });

    document.getElementById("applySlotListBtn").addEventListener("click", () => {
      const lines = document.getElementById("pasteSlotTextarea").value
        .split(/\r?\n/)
        .map(l => l.trim())
        .filter(Boolean);

      if (!lines.length) return;

      lines.slice(0, 12).forEach((line, i) => {
        const [teamPart, iglPart] = line.split("|").map(s => (s || "").trim());
        if (!appState.teams[i]) {
          appState.teams[i] = {
            slot: i + 1,
            logo: "TS",
            name: `TEAM SLOT ${i + 1}`,
            igl: "",
            m1: { pp: 0, fp: 0, cd: 0 },
            m2: { pp: 0, fp: 0, cd: 0 },
            m3: { pp: 0, fp: 0, cd: 0 }
          };
        }
        if (teamPart) {
          appState.teams[i].name = teamPart;
          appState.teams[i].logo = makeLogo(teamPart);
        }
        appState.teams[i].igl = iglPart || "";
      });

      save();
      renderAll();
      document.getElementById("slotEditorBox").classList.remove("show");
    });

    document.getElementById("downloadPicBtn").addEventListener("click", downloadPicDirectly);

    document.getElementById("resetBtn").addEventListener("click", () => {
      if (!confirm("Match 1, Match 2, Match 3-এর সব পয়েন্ট রিসেট করতে চাও?")) return;
      appState.teams.forEach(t => {
        t.m1 = { pp: 0, fp: 0, cd: 0 };
        t.m2 = { pp: 0, fp: 0, cd: 0 };
        t.m3 = { pp: 0, fp: 0, cd: 0 };
      });
      save();
      renderAll();
    });

    document.getElementById("copyWaBtn").addEventListener("click", () => {
      const sorted = appState.teams
        .map(t => ({ ...t, st: computeTeamStats(t) }))
        .sort((a, b) => b.st.tp - a.st.tp);

      const text = [
        `🏆 *${appState.bannerTitle}*`,
        `📅 ${appState.dateLine}`,
        ""
      ];
      sorted.forEach((r, i) => {
        text.push(`#${pad2(i + 1)} *${r.name}* — ${r.st.tp} PTS (PP: ${r.st.pp} | FP: ${r.st.fp})`);
      });
      navigator.clipboard?.writeText(text.join("\n"));
      alert("WhatsApp standings text কপি হয়েছে!");
    });

    load();
    renderAll();
  </script>
</body>
</html>
